<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图纸工作台</title>
    <style>
      :root {
        --surface: rgba(255, 255, 255, 0.88);
        --surface-strong: rgba(255, 255, 255, 0.96);
        --line: rgba(23, 48, 77, 0.1);
        --text: #17304d;
        --muted: #6e8099;
        --blue-soft: rgba(35, 125, 240, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(35, 125, 240, 0.08), transparent 24%),
          linear-gradient(180deg, #eef3f9 0%, #f8fafc 100%);
      }

      .floating-shell {
        position: fixed;
        z-index: 20;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        pointer-events: none;
      }

      .floating-meta,
      .floating-actions {
        pointer-events: auto;
      }

      .floating-meta {
        max-width: min(760px, calc(100vw - 220px));
        display: grid;
        gap: 4px;
        padding: 12px 14px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--surface);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 48px rgba(10, 24, 44, 0.12);
      }

      .meta-kicker {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .meta-title,
      .meta-line {
        margin: 0;
      }

      .meta-title {
        font-size: 17px;
        line-height: 1.3;
      }

      .meta-line {
        color: var(--muted);
        font-size: 12px;
      }

      .floating-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid rgba(35, 125, 240, 0.18);
        background: var(--blue-soft);
        color: #135dc1;
        font-size: 12px;
        font-weight: 700;
        backdrop-filter: blur(18px);
        box-shadow: 0 12px 32px rgba(10, 24, 44, 0.1);
      }

      .ghost-button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid rgba(23, 48, 77, 0.14);
        background: var(--surface-strong);
        color: var(--text);
        font: inherit;
        text-decoration: none;
        cursor: pointer;
        backdrop-filter: blur(18px);
        box-shadow: 0 16px 38px rgba(10, 24, 44, 0.12);
      }

      .workspace {
        position: fixed;
        inset: 0;
      }

      .frame,
      .state-card-wrap {
        position: absolute;
        inset: 0;
      }

      .frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #f5f8fd;
      }

      .state-card-wrap {
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .state-card {
        width: min(720px, 100%);
        padding: 22px 24px;
        border-radius: 24px;
        border: 1px solid var(--line);
        background: var(--surface-strong);
        box-shadow: 0 24px 64px rgba(10, 24, 44, 0.12);
        display: grid;
        gap: 12px;
      }

      .state-card h2,
      .state-card p,
      .state-card pre {
        margin: 0;
      }

      .state-card p {
        color: var(--muted);
        line-height: 1.7;
      }

      .state-card pre {
        overflow: auto;
        padding: 14px;
        border-radius: 16px;
        background: #f5f8fc;
        color: #27405d;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .hidden {
        display: none !important;
      }


      /* UI audit third pass: external workspace visual unification */
      :root {
        --bg: #eef3f9;
        --surface: rgba(255, 255, 255, 0.9);
        --surface-strong: rgba(255, 255, 255, 0.98);
        --line: rgba(18, 33, 58, 0.1);
        --text: #19314f;
        --muted: #60728a;
        --blue: #1d6fe8;
        --blue-deep: #1559bd;
        --blue-soft: rgba(29, 111, 232, 0.1);
        --focus-ring: 0 0 0 4px rgba(29, 111, 232, 0.14);
        --shadow-soft: 0 14px 36px rgba(20, 43, 78, 0.1);
      }

      body {
        font-family: ui-sans-serif, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(circle at 16% -10%, rgba(29, 111, 232, 0.12), transparent 34%),
          linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      .floating-meta,
      .floating-actions .chip,
      .ghost-button,
      .state-card,
      .panel {
        border-color: var(--line);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 251, 255, 0.92));
        box-shadow: var(--shadow-soft);
      }

      .floating-meta {
        border-radius: 22px;
      }

      .meta-kicker {
        color: var(--muted);
      }

      .meta-title,
      .state-card h2,
      .panel h2,
      .viewer-card-head strong {
        color: #0b1220;
        letter-spacing: -0.02em;
      }

      .chip,
      .status-pill {
        border-color: rgba(29, 111, 232, 0.22);
        background: var(--blue-soft);
        color: var(--blue-deep);
        font-weight: 800;
      }

      .status-pill.neutral {
        border-color: rgba(96, 114, 138, 0.2);
        background: rgba(96, 114, 138, 0.09);
        color: var(--muted);
      }

      .ghost-button,
      .button {
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
      }

      .ghost-button:hover,
      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: rgba(29, 111, 232, 0.24);
        color: var(--blue-deep);
        background: #fff;
      }

      .ghost-button:active,
      .button:active:not(:disabled) {
        transform: translateY(0) scale(0.985);
      }

      .state-card {
        border-radius: 26px;
      }

      .state-card pre {
        border: 1px solid rgba(18, 33, 58, 0.08);
        background: #f4f7fb;
        color: #27405d;
      }

      .frame,
      .viewer-frame,
      .viewer-mount {
        background:
          linear-gradient(45deg, rgba(203, 216, 232, 0.22) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(203, 216, 232, 0.22) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(203, 216, 232, 0.22) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(203, 216, 232, 0.22) 75%),
          #eef3f8;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        background-size: 20px 20px;
      }

      @media (max-width: 720px) {
        .floating-shell {
          align-items: stretch;
          flex-direction: column;
        }

        .floating-meta {
          max-width: none;
        }

        .floating-actions {
          width: 100%;
          flex-wrap: wrap;
        }

        .floating-actions > * {
          flex: 1 1 auto;
          justify-content: center;
        }

        .state-card-wrap,
        .state-wrap {
          padding: 16px;
        }
      }



      /* UI audit sixth pass: external page accessibility */
      @media (hover: none), (pointer: coarse) {
        button,
        a.ghost-button,
        .ghost-button,
        .button,
        .mode-button,
        .text-input,
        select {
          min-height: 44px;
        }
      }

      @media (prefers-contrast: more) {
        :root {
          --line: rgba(18, 33, 58, 0.34);
          --muted: #3f526b;
          --blue: #0f5fcb;
          --blue-deep: #0b4fa8;
          --focus-ring: 0 0 0 4px rgba(11, 79, 168, 0.28);
        }

        .floating-meta,
        .ghost-button,
        .button,
        .state-card,
        .panel,
        .chip,
        .status-pill,
        .text-input,
        select {
          border-color: rgba(18, 33, 58, 0.34);
        }
      }

      @media (forced-colors: active) {
        * {
          box-shadow: none !important;
          text-shadow: none !important;
        }

        button,
        a,
        input,
        select,
        textarea,
        .floating-meta,
        .ghost-button,
        .button,
        .state-card,
        .panel,
        .chip,
        .status-pill {
          border: 1px solid CanvasText !important;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
          outline: 2px solid Highlight !important;
          outline-offset: 2px;
        }

        .button.primary,
        .mode-button.active {
          forced-color-adjust: none;
          background: Highlight !important;
          color: HighlightText !important;
          border-color: Highlight !important;
        }
      }

    </style>
  </head>
  <body>
    <div class="floating-shell">
      <div class="floating-meta">
        <span id="pageKicker" class="meta-kicker">Drawing Workspace</span>
        <h1 id="pageTitle" class="meta-title">正在准备图纸...</h1>
        <p id="pageMeta" class="meta-line">正在加载图纸浏览配置。</p>
      </div>
      <div class="floating-actions">
        <span id="modeChip" class="chip">图纸浏览</span>
        <a id="downloadButton" class="ghost-button hidden" href="#" target="_blank" rel="noreferrer">下载图纸</a>
        <button id="backButton" class="ghost-button" type="button">返回系统</button>
      </div>
    </div>

    <main class="workspace">
      <iframe id="drawingFrame" class="frame hidden" title="图纸浏览"></iframe>
      <div id="stateWrap" class="state-card-wrap">
        <article class="state-card">
          <h2 id="stateTitle">正在连接图纸浏览页</h2>
          <p id="stateMessage">稍等一下，我们会拉取文件信息并加载图纸内容。</p>
          <pre id="stateDetail" class="hidden"></pre>
        </article>
      </div>
    </main>

    <script>
      const LANGUAGE_STORAGE_KEY = "cde.language";
      const STANDALONE_EN_TEXT = {
        "正在准备图纸...": "Preparing drawing...",
        "正在加载图纸浏览配置。": "Loading drawing viewer configuration.",
        "图纸浏览": "Drawing View",
        "图纸审阅": "Drawing Review",
        "下载图纸": "Download Drawing",
        "下载 PDF": "Download PDF",
        "返回系统": "Back to System",
        "图纸浏览页": "Drawing View Page",
        "图纸审阅页": "Drawing Review Page",
        "正在连接图纸浏览页": "Connecting to Drawing View Page",
        "正在连接图纸审阅页": "Connecting to Drawing Review Page",
        "稍等一下，我们会拉取文件信息并加载图纸内容。": "Please wait while file information and drawing content are loaded.",
        "图纸": "Drawing",
        "PDF 工作台": "PDF Workspace",
        "图纸工作台": "Drawing Workspace",
        "PDF审阅": "PDF Review",
        "PDF浏览": "PDF View",
        "当前PDF": "Current PDF",
        "历史PDF": "Historical PDF",
        "当前图纸": "Current Drawing",
        "历史图纸": "Historical Drawing",
        "当前": "Current",
        "历史": "Historical",
        "未关联流程": "No Workflow Linked",
        "当前用户：": "User: ",
        "历史版本": "Historical Version",
        "缺少文件参数": "Missing File Parameter",
        "请从文件列表或流程页重新打开工作台。": "Reopen the workspace from the file list or workflow page.",
        "获取图纸信息失败，状态码": "Failed to get drawing information, status",
        "不存在或无权限": "does not exist or cannot be accessed",
        "当前用户无法访问这份": "The current user cannot access this",
        "，或者文件已被删除。": ", or the file has been deleted.",
        "没有可预览版本": "No Previewable Version",
        "这份": "This",
        "暂时没有可用的版本记录。": "does not have available version records yet.",
        "缺少预览地址": "Missing Preview URL",
        "当前": "Current",
        "没有可用的预览文件，请稍后重试。": "has no available preview file. Please try again later.",
        "加载失败": "Load Failed",
        "加载": "Loading",
        "时发生未知错误。": "failed with an unknown error.",
      };

      function currentLanguage() {
        try {
          return window.localStorage.getItem(LANGUAGE_STORAGE_KEY) === "en" ? "en" : "zh";
        } catch {
          return "zh";
        }
      }

      function t(zh, en) {
        return currentLanguage() === "en" ? en : zh;
      }

      function localizeStandaloneText(value) {
        const source = String(value ?? "");
        if (!source || currentLanguage() !== "en" || !/[\u4e00-\u9fff]/.test(source)) {
          return source;
        }
        if (STANDALONE_EN_TEXT[source]) {
          return STANDALONE_EN_TEXT[source];
        }
        let result = source.replace(/当前用户：/g, "User: ");
        Object.entries(STANDALONE_EN_TEXT)
          .filter(([zh]) => Array.from(zh).length > 1)
          .sort((left, right) => right[0].length - left[0].length)
          .forEach(([zh, en]) => {
            result = result.replaceAll(zh, en);
          });
        return result;
      }

      function hasCjkText(value) {
        return /[\u4e00-\u9fff]/.test(String(value || ""));
      }

      function localizeUserMessage(value, fallback = t("图纸加载失败", "Drawing load failed.")) {
        const fallbackValue = String(fallback || "").trim() || t("图纸加载失败", "Drawing load failed.");
        const source = String(value || "").trim() || fallbackValue;
        const localized = localizeStandaloneText(source);
        return currentLanguage() === "en" && hasCjkText(localized) ? fallbackValue : localized;
      }

      function applyStandaloneTranslations(root = document.body) {
        if (currentLanguage() !== "en" || !root) {
          return;
        }
        const translateNode = (node) => {
          if (node.nodeType === Node.TEXT_NODE && /[\u4e00-\u9fff]/.test(node.nodeValue || "")) {
            node.nodeValue = localizeStandaloneText(node.nodeValue);
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) {
            return;
          }
          ["placeholder", "title", "aria-label", "alt"].forEach((attribute) => {
            const value = node.getAttribute(attribute);
            if (value && /[\u4e00-\u9fff]/.test(value)) {
              node.setAttribute(attribute, localizeStandaloneText(value));
            }
          });
        };
        translateNode(root);
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_ALL, {
          acceptNode(node) {
            if (node.nodeType === Node.ELEMENT_NODE && ["SCRIPT", "STYLE", "SVG", "PATH"].includes(node.tagName)) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          },
        });
        while (walker.nextNode()) {
          translateNode(walker.currentNode);
        }
      }

      function startStandaloneTranslationObserver() {
        if (currentLanguage() !== "en" || typeof MutationObserver === "undefined") {
          return;
        }
        applyStandaloneTranslations();
        const observer = new MutationObserver((records) => {
          records.forEach((record) => {
            if (record.type === "characterData" || record.type === "attributes") {
              applyStandaloneTranslations(record.target);
              return;
            }
            record.addedNodes.forEach((node) => applyStandaloneTranslations(node));
          });
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true,
          attributes: true,
          attributeFilter: ["placeholder", "title", "aria-label", "alt"],
        });
      }

      startStandaloneTranslationObserver();
      document.title = localizeStandaloneText(document.title);

      const params = new URLSearchParams(window.location.search);
      const docId = params.get("docId") || "";
      const versionId = params.get("versionId") || "";
      const mode = params.get("mode") === "review" ? "review" : "view";
      const actor = params.get("actor") || "";

      const pageKicker = document.querySelector("#pageKicker");
      const pageTitle = document.querySelector("#pageTitle");
      const pageMeta = document.querySelector("#pageMeta");
      const modeChip = document.querySelector("#modeChip");
      const downloadButton = document.querySelector("#downloadButton");
      const stateWrap = document.querySelector("#stateWrap");
      const stateTitle = document.querySelector("#stateTitle");
      const stateMessage = document.querySelector("#stateMessage");
      const stateDetail = document.querySelector("#stateDetail");
      const drawingFrame = document.querySelector("#drawingFrame");

      function leaveWorkspace() {
        if (window.opener && !window.opener.closed) {
          window.close();
          return;
        }
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = "/";
      }

      document.querySelector("#backButton").addEventListener("click", leaveWorkspace);

      function updateState(title, message, detail = "") {
        stateTitle.textContent = localizeStandaloneText(title);
        stateMessage.textContent = localizeStandaloneText(message);
        stateDetail.textContent = localizeStandaloneText(detail);
        stateDetail.classList.toggle("hidden", !detail);
        stateWrap.classList.remove("hidden");
        drawingFrame.classList.add("hidden");
      }

      function fileExtension(name) {
        const value = String(name || "");
        const index = value.lastIndexOf(".");
        return index >= 0 ? value.slice(index + 1).toLowerCase() : "";
      }

      function isPdfDocument(doc) {
        return String(doc?.mimeType || "").toLowerCase() === "application/pdf" || fileExtension(doc?.name) === "pdf";
      }

      function workspaceProfile(doc, entry) {
        const pdf = isPdfDocument(doc);
        const assetLabel = pdf ? "PDF" : t("图纸", "Drawing");
        const versionLabel = entry.id === doc.currentVersionId || entry.isCurrent ? `${entry.version} · ${t("当前", "Current")}${assetLabel}` : `${entry.version} · ${t("历史", "Historical")}${assetLabel}`;
        return {
          assetLabel,
          workspaceLabel: pdf ? "PDF Workspace" : "Drawing Workspace",
          workspaceTitle: pdf ? "PDF Workspace" : t("图纸工作台", "Drawing Workspace"),
          modeLabel: mode === "review" ? `${assetLabel}${t("审阅", " Review")}` : `${assetLabel}${t("浏览", " View")}`,
          versionLabel,
          downloadLabel: pdf ? t("下载 PDF", "Download PDF") : t("下载图纸", "Download Drawing"),
          loadTitle: mode === "review" ? `${t("正在连接", "Connecting to ")}${assetLabel}${t("审阅页", " Review Page")}` : `${t("正在连接", "Connecting to ")}${assetLabel}${t("浏览页", " View Page")}`,
          loadMessage: `${t("稍等一下，我们会拉取文件信息并加载", "Please wait while file information and ")}${assetLabel}${t("内容。", " content are loaded.")}`,
          notFoundTitle: `${assetLabel}${t("不存在或无权限", " does not exist or cannot be accessed")}`,
          notFoundMessage: `${t("当前用户无法访问这份", "The current user cannot access this ")}${assetLabel}${t("，或者文件已被删除。", ", or the file has been deleted.")}`,
          emptyVersionTitle: t("没有可预览版本", "No Previewable Version"),
          emptyVersionMessage: `${t("这份", "This ")}${assetLabel}${t("暂时没有可用的版本记录。", " does not have available version records yet.")}`,
          missingPreviewTitle: t("缺少预览地址", "Missing Preview URL"),
          missingPreviewMessage: `${t("当前", "Current ")}${assetLabel}${t("没有可用的预览文件，请稍后重试。", " has no available preview file. Please try again later.")}`,
          loadFailedTitle: `${assetLabel}${t("加载失败", " Load Failed")}`,
          loadFailedMessage: `${t("加载", "Loading ")}${assetLabel}${mode === "review" ? t("审阅", " review") : t("浏览", " view")}${t("页时发生未知错误。", " page failed with an unknown error.")}`,
        };
      }

      function showDrawingViewer(payload) {
        const { doc, entry, frameUrl } = payload;
        const isCurrent = entry.id === doc.currentVersionId || entry.isCurrent;
        const profile = workspaceProfile(doc, entry);
        const fileUrl = entry.fileUrl || doc.fileUrl || frameUrl;
        const fileName = String(doc.name || "drawing.pdf");
        const dotIndex = fileName.lastIndexOf(".");
        const baseName = dotIndex > 0 ? fileName.slice(0, dotIndex) : fileName;
        const extension = dotIndex > 0 ? fileName.slice(dotIndex) : ".pdf";
        const downloadName = `${baseName}_${entry.version}${extension}`;

        document.title = localizeStandaloneText(`${doc.name || profile.assetLabel} - ${profile.workspaceTitle}`);
        pageKicker.textContent = profile.workspaceLabel;
        pageTitle.textContent = doc.name || profile.workspaceTitle;
        pageMeta.textContent = [
          profile.versionLabel,
          doc.workflowName || t("未关联流程", "No Workflow Linked"),
          actor ? `${t("当前用户：", "User: ")}${actor}` : "",
          doc.owner ? `Owner: ${doc.owner}` : "",
        ].filter(Boolean).join(" · ");
        modeChip.textContent = isCurrent ? profile.modeLabel : t("历史版本", "Historical Version");
        downloadButton.href = new URL(
          `${fileUrl}?download=${encodeURIComponent(downloadName)}&t=${encodeURIComponent(entry.uploadedAt || doc.updatedAt || "")}`,
          window.location.origin,
        ).toString();
        downloadButton.textContent = profile.downloadLabel;
        downloadButton.classList.remove("hidden");
        drawingFrame.title = profile.modeLabel;
        drawingFrame.src = frameUrl;
        stateWrap.classList.add("hidden");
        drawingFrame.classList.remove("hidden");
      }

      async function loadDrawingViewer() {
        if (!docId) {
          updateState(t("缺少文件参数", "Missing File Parameter"), t("请从文件列表或流程页重新打开工作台。", "Reopen the workspace from the file list or workflow page."));
          return;
        }

        updateState(mode === "review" ? t("正在连接图纸审阅页", "Connecting to Drawing Review Page") : t("正在连接图纸浏览页", "Connecting to Drawing View Page"), t("稍等一下，我们会拉取文件信息并加载图纸内容。", "Please wait while file information and drawing content are loaded."));

        try {
          const response = await fetch("/api/documents", {
            credentials: "same-origin",
            headers: {
              "Cache-Control": "no-store",
            },
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const serverMessage = [payload.error, payload.message].find(Boolean);
            throw new Error(localizeUserMessage(serverMessage, `${t("获取图纸信息失败，状态码", "Failed to get drawing information, status")} ${response.status}`));
          }
          const documents = Array.isArray(payload.documents) ? payload.documents : [];
          const doc = documents.find((item) => item.id === docId);
          const profile = workspaceProfile(doc || {}, {});
          if (!doc) {
            updateState(profile.notFoundTitle, profile.notFoundMessage);
            return;
          }

          const entries = Array.isArray(doc.versionHistory) ? doc.versionHistory : [];
          const entry =
            (versionId ? entries.find((item) => item.id === versionId) : null) ||
            entries.find((item) => item.id === doc.currentVersionId) ||
            entries[0] ||
            null;
          const resolvedProfile = workspaceProfile(doc, entry || {});
          if (!entry) {
            updateState(resolvedProfile.emptyVersionTitle, resolvedProfile.emptyVersionMessage);
            return;
          }

          const previewPath = entry.previewUrl || entry.fileUrl || doc.fileUrl || "";
          if (!previewPath) {
            updateState(resolvedProfile.missingPreviewTitle, resolvedProfile.missingPreviewMessage);
            return;
          }

          const frameUrl = new URL(
            `${previewPath}?t=${encodeURIComponent(entry.uploadedAt || doc.updatedAt || "")}`,
            window.location.origin,
          ).toString();
          showDrawingViewer({ doc, entry, frameUrl });
        } catch (error) {
          const fallbackLabel = mode === "review" ? t("图纸审阅页", "Drawing Review Page") : t("图纸浏览页", "Drawing View Page");
          updateState(
            t("图纸加载失败", "Drawing Load Failed"),
            localizeUserMessage(
              error && error.message ? error.message : "",
              `${t("加载", "Loading ")}${fallbackLabel}${t("时发生未知错误。", " failed with an unknown error.")}`,
            ),
            currentLanguage() === "en" ? "" : error && error.stack ? error.stack : "",
          );
        }
      }

      void loadDrawingViewer();
    </script>
  </body>
</html>
